hero:
  eyebrow: "Инсталляционные решения"
  title: "Искусство аудио- и видеорешений"
  description: "Полный цикл: от обсуждения концепции до ввода в эксплуатацию и последующей поддержки. Нашему опыту доверяют не только частные клиенты, но и ведущие компании, архитектурные бюро, отели и девелоперы."
  primary_cta: "Заказать консультацию"
  secondary_cta: "Узнать услуги"
  stats_label: "Опыт и надежность"
  stats_value: "1200+ выполненных проектов"
  image: "images/hero-cover.jpg"

services:
  - title: "Стереосистемы"
    description: "Двухканальные стереосистемы для высококачественного воспроизведения музыки (виниловые проигрыватели, стереоусилители и акустические системы)."
    image: "images/stereo.jpg"
  - title: "Мультимедийные комнаты"
    description: "Универсальное пространство для отдыха, объединяющее просмотр кино, ТВ, прослушивание музыки с удобным управлением и сохранением дизайна помещения."
    image: "images/multimedia.jpg"
  - title: "Персональные кинозалы"
    description: "Полноценный кинозал — от концепции и акустического расчета до установки специализированного оборудования с максимальным качеством звука."
    image: "images/home-theater.jpg"
  - title: "Системы мультирум"
    description: "Единая аудиосистема для всего дома с независимыми зонами, источниками и управлением через приложение, панели или сценарии автоматизации."
    image: "images/multiroom.png"
  - title: "Системы управления"
    description: "Интеллектуальное управление аудио-видео через единый интуитивный интерфейс. Контроль сцен, источников, доп. управление домашней автоматизацией."
    image: "images/control-systems.jpg"
  - title: "Решения для HoReCa"
    description: "Звуковые и мультимедиа-решения для ресторанов и кафе, где качественный звук становится частью атмосферы и впечатления гостей."
    image: "images/horeca.jpg"

process:
  - step: 1
    title: "Ваше обращение"
    description: "Вы описываете задачу, мы слушаем и изучаем объект вашего проекта."
  - step: 2
    title: "Разработка концепции"
    description: "Развиваем идею с учетом архитектуры, дизайна и вашего бюджета."
  - step: 3
    title: "Подготовка спецификации и проектирование"
    description: "Профессиональное проектирование обеспечивает точный подбор оборудования и его корректную интеграцию в пространство."
  - step: 4
    title: "Реализация и запуск"
    description: "Установка, настройка, проверка и обучение. Полная поддержка на протяжении всего проекта."

advantages:
  - title: "Экспертиза и опыт"
    description: "30 лет работы и 1200+ выполненных проектов. Проверенные решения с надежными отношениями с партнерами по всему миру."
  - title: "Собственный шоу-рум"
    description: "Любое выбранное оборудование можно услышать и увидеть в работе. Принимайте решения на основе реального опыта."
  - title: "Полный цикл"
    description: "Синергия бизнес-процессов, охватывающая весь цикл проекта — от обсуждения концепции до ввода в эксплуатацию и поддержки."
  - title: "Индивидуальный подход"
    description: "Мы проектируем системы под вашу архитектуру, бюджет и стиль жизни, сохраняя дизайн и чистоту монтажа."

