# Конфигурация Pages CMS.
# Управление контентом лендинга через файл content/page.yml.
media:
  input: images
  output: /images
content:
  - name: landing
    label: Лендинг
    type: file
    path: content/page.yml
    fields:

      # ── Hero ──────────────────────────────────────────
      - name: hero_eyebrow
        label: "Hero — подзаголовок"
        type: string
      - name: hero_title
        label: "Hero — заголовок"
        type: string
      - name: hero_description
        label: "Hero — описание"
        type: text
      - name: hero_primary_cta
        label: "Hero — текст главной кнопки"
        type: string
      - name: hero_secondary_cta
        label: "Hero — текст второй кнопки"
        type: string
      - name: hero_stats_label
        label: "Hero — подпись статистики"
        type: string
      - name: hero_stats_value
        label: "Hero — значение статистики"
        type: string
      - name: hero_image
        label: "Hero — картинка"
        type: image

      # ── Услуги ────────────────────────────────────────
      - name: services
        label: Услуги
        type: list
        fields:
          - name: title
            label: Название
            type: string
          - name: description
            label: Описание
            type: text
          - name: image
            label: Картинка
            type: image

      # ── Этапы работы ──────────────────────────────────
      - name: process
        label: Этапы работы
        type: list
        fields:
          - name: step
            label: Номер шага
            type: string
          - name: title
            label: Заголовок
            type: string
          - name: description
            label: Описание
            type: text

      # ── Преимущества ──────────────────────────────────
      - name: advantages
        label: Преимущества
        type: list
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: description
            label: Описание
            type: text

      # ── Экспертиза ────────────────────────────────────
      - name: expertise_intro
        label: "Экспертиза — вступительный текст"
        type: text
      - name: expertise_diplomas
        label: "Экспертиза — дипломы"
        type: list
        fields:
          - name: image
            label: Изображение
            type: image
          - name: title
            label: Подпись
            type: string

      # ── Клиенты ───────────────────────────────────────
      - name: clients_title
        label: "Клиенты — заголовок раздела"
        type: string
      - name: clients_logos
        label: "Клиенты — логотипы"
        type: list
        fields:
          - name: image
            label: Логотип
            type: image
          - name: name
            label: Название компании
            type: string

      # ── Галерея ───────────────────────────────────────
      - name: gallery
        label: Галерея
        type: list
        fields:
          - name: title
            label: Название категории
            type: string
          - name: image
            label: Превью (обложка)
            type: image
          - name: images
            label: Все фото в категории
            type: list
            field:
              label: Фото
              type: image

      # ── Команда ───────────────────────────────────────
      - name: team_photo
        label: "Команда — групповое фото"
        type: image
      - name: team_members
        label: "Команда — участники"
        type: list
        fields:
          - name: name
            label: Имя
            type: string
          - name: role
            label: Должность
            type: string

      # ── Контакты ──────────────────────────────────────
      - name: contact_intro
        label: "Контакты — вступительный текст"
        type: text
      - name: contact_phone
        label: "Контакты — телефон"
        type: string
      - name: contact_email
        label: "Контакты — email"
        type: string
      - name: contact_hours
        label: "Контакты — время работы"
        type: string

      # ── CTA ───────────────────────────────────────────
      - name: cta_title
        label: "CTA — заголовок"
        type: string
      - name: cta_button
        label: "CTA — текст кнопки"
        type: string
