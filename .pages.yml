# Конфигурация Pages CMS.
# Управление контентом лендинга через файл content/page.yml.
media:
  input: images
  output: /images
content:
  - name: landing
    label: Лендинг
    type: file
    path: content/page.yml
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - name: eyebrow
            label: Верхний текст
            type: string
          - name: title
            label: Заголовок
            type: string
          - name: description
            label: Описание
            type: text
          - name: primary_cta
            label: Текст главной кнопки
            type: string
          - name: secondary_cta
            label: Текст второй кнопки
            type: string
          - name: stats_label
            label: Подпись статистики
            type: string
          - name: stats_value
            label: Значение статистики
            type: string
          - name: image
            label: Картинка hero
            type: image
      - name: services
        label: Услуги
        type: list
        fields:
          - name: title
            label: Заголовок услуги
            type: string
          - name: description
            label: Описание услуги
            type: text
          - name: image
            label: Картинка услуги
            type: image
      - name: process
        label: Этапы работы
        type: list
        fields:
          - name: step
            label: Шаг (номер)
            type: number
          - name: title
            label: Заголовок шага
            type: string
          - name: description
            label: Описание шага
            type: text
      - name: advantages
        label: Преимущества
        type: list
        fields:
          - name: title
            label: Заголовок преимущества
            type: string
          - name: description
            label: Описание преимущества
            type: text
      - name: expertise
        label: Экспертиза и дипломы
        type: object
        fields:
          - name: intro
            label: Вступительный текст
            type: text
          - name: diplomas
            label: Дипломы
            type: list
            fields:
              - name: image
                label: Изображение диплома
                type: image
              - name: title
                label: Подпись
                type: string
      - name: clients
        label: Клиенты
        type: object
        fields:
          - name: title
            label: Заголовок раздела
            type: string
          - name: logos
            label: Логотипы клиентов
            type: list
            fields:
              - name: image
                label: Логотип
                type: image
              - name: name
                label: Название компании
                type: string
      - name: gallery
        label: Галерея
        type: list
        fields:
          - name: title
            label: Название категории
            type: string
          - name: image
            label: Превью (обложка)
            type: image
          - name: images
            label: Все фото в категории
            type: list
            field:
              label: Фото
              type: image
      - name: team
        label: Команда
        type: object
        fields:
          - name: photo
            label: Групповое фото команды
            type: image
          - name: members
            label: Участники
            type: list
            fields:
              - name: name
                label: Имя
                type: string
              - name: role
                label: Должность
                type: string
      - name: contact
        label: Контакты
        type: object
        fields:
          - name: intro
            label: Вступительный текст
            type: text
          - name: phone
            label: Телефон
            type: string
          - name: email
            label: Email
            type: string
          - name: hours
            label: Время работы
            type: string
      - name: cta
        label: CTA
        type: object
        fields:
          - name: title
            label: Заголовок CTA
            type: string
          - name: button
            label: Текст кнопки CTA
            type: string
